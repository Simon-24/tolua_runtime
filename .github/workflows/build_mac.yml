name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Universal tolua.bundle
      run: |
        # 创建输出目录
        mkdir -p Plugins
        
        # 直接使用 clang 编译，同时指定 x86_64 和 arm64，生成通用二进制文件
        clang -O2 -bundle -undefined dynamic_lookup \
          -arch x86_64 -arch arm64 \
          -o Plugins/tolua.bundle \
          -I/usr/local/include -I./macnojit/ \
          tolua.c \
          int64.c \
          uint64.c \
          pb.c \
          lpeg.c \
          struct.c \
          cjson/strbuf.c \
          cjson/lua_cjson.c \
          cjson/fpconv.c \
          luasocket/auxiliar.c \
          luasocket/buffer.c \
          luasocket/except.c \
          luasocket/inet.c \
          luasocket/io.c \
          luasocket/luasocket.c \
          luasocket/mime.c \
          luasocket/options.c \
          luasocket/select.c \
          luasocket/tcp.c \
          luasocket/timeout.c \
          luasocket/udp.c \
          luasocket/usocket.c \
          macnojit/lapi.c macnojit/lcode.c macnojit/lctype.c macnojit/ldebug.c macnojit/ldo.c macnojit/ldump.c \
          macnojit/lfunc.c macnojit/lgc.c macnojit/llex.c macnojit/lmem.c macnojit/lobject.c macnojit/lopcodes.c macnojit/lparser.c \
          macnojit/lstate.c macnojit/lstring.c macnojit/ltable.c macnojit/ltm.c macnojit/lundump.c macnojit/lvm.c macnojit/lzio.c \
          macnojit/lauxlib.c macnojit/lbaselib.c macnojit/lbitlib.c macnojit/lcorolib.c macnojit/ldblib.c macnojit/liolib.c \
          macnojit/lmathlib.c macnojit/loslib.c macnojit/lstrlib.c macnojit/ltablib.c macnojit/loadlib.c macnojit/linit.c
          
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64
        path: Plugins/tolua.bundle
