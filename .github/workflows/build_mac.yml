name: Build Mac ToLua Bundle

on:
  workflow_dispatch: # 允许你手动点击运行

jobs:
  build:
    runs-on: macos-latest # 关键：强制使用 GitHub 的 Intel 架构 Mac 虚拟机
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Modify Build Script for ARM64
      run: |
        cd mac
        # 修改脚本：在 clang 编译参数里加上 arm64 支持
        sed -i '' 's/-arch x86_64/-arch x86_64 -arch arm64/g' build_osx.sh
        
    - name: Build tolua.bundle
      run: |
        cd mac
        chmod +x build_osx.sh
        ./build_osx.sh
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: tolua_mac_bundle_arm64
        path: mac/Plugins/tolua.bundle
