name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Xcodebuild with ARM64 Overrides
      run: |
        # 1. 进入他的 Xcode 工程所在目录
        cd macnojit
        
        # 2. 清理旧产物
        xcodebuild clean
        
        # 3. 核心绝杀：直接用命令行参数覆盖 .pbxproj 里过时的架构配置！
        # 强制指定双架构 (x86_64 arm64)，强制最低系统版本 10.13
        xcodebuild -configuration=Release \
          ARCHS="x86_64 arm64" \
          VALID_ARCHS="x86_64 arm64" \
          MACOSX_DEPLOYMENT_TARGET=10.13
          
        # 4. 灵魂验证：打印新生成的二进制文件的架构
        echo "=== 检查新生成的二进制架构 ==="
        lipo -info build/Release/tolua.bundle/Contents/MacOS/tolua

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64_FINAL
        # 5. 我们不再上传外部的 Plugins 目录了，直接深入虎穴，
        # 把刚出炉、还热乎的 build/Release/tolua.bundle 端走！
        path: macnojit/build/Release/tolua.bundle
