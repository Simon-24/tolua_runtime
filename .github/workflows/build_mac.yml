name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Modify Original Build Script
      run: |
        # 1. 强行修改原作者的 build_osx.sh
        # 在脚本中所有的 gcc 或 clang 命令中追加 -arch arm64
        sed -i '' 's/-arch x86_64/-arch x86_64 -arch arm64/g' build_osx.sh
        
        # 2. 如果脚本内部调用了 xcodebuild，我们需要修改 .xcodeproj
        # 很多情况下 macnojit 其实也是调用 xcodebuild 编译的静态库
        if [ -d "macnojit/tolua.xcodeproj" ]; then
            sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_64_BIT)";/ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
            sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_BIT)";/ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
            sed -i '' 's/VALID_ARCHS = "i386 x86_64";/VALID_ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
            sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.8;/MACOSX_DEPLOYMENT_TARGET = 10.13;/g' macnojit/tolua.xcodeproj/project.pbxproj
        fi

    - name: Run Original Build Script
      run: |
        # 赋予执行权限并运行
        chmod +x build_osx.sh
        ./build_osx.sh

    - name: Verify Architecture & Prepare Artifact
      run: |
        # 建立一个隔离的输出目录，确保我们拿到的是新产物
        mkdir -p FinalOutput
        
        # 拷贝生成的 bundle (作者的脚本默认生成在 Plugins/tolua.bundle)
        cp -r Plugins/tolua.bundle FinalOutput/
        
        echo "=== 检查最终产物的架构 ==="
        lipo -info FinalOutput/tolua.bundle/Contents/MacOS/tolua

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64_FINAL
        path: FinalOutput/tolua.bundle
