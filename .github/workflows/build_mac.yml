name: Build Mac ToLua Bundle (Modern Fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout alex4814's tolua_runtime
      uses: actions/checkout@v4
      with:
        repository: alex4814/tolua_runtime
        submodules: recursive

    - name: Build Universal Bundle
      run: |
        chmod +x build_tolua_osx_universal.sh
        ./build_tolua_osx_universal.sh
        
    - name: Verify Architecture
      run: |
        echo "=== 检查生成的二进制架构 ==="
        # 【修改点】检查它新生成的专属路径！
        lipo -info Plugins/macOS/universal/tolua.bundle/Contents/MacOS/tolua

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_universal_PERFECT
        # 【修改点】上传这个新路径下热乎乎的包！
        path: Plugins/macOS/universal/tolua.bundle
