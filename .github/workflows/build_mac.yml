name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Hardcore Build tolua.bundle
      run: |
        # 1. 创建一个绝对干净的输出目录（名字叫 FreshOutput，防止和仓库原有文件混淆）
        mkdir -p FreshOutput/tolua.bundle/Contents/MacOS
        
        # 2. 创建 Info.plist
        cat << 'EOF' > FreshOutput/tolua.bundle/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>tolua</string>
            <key>CFBundleIdentifier</key>
            <string>com.topameng.tolua</string>
            <key>CFBundleName</key>
            <string>tolua</string>
            <key>CFBundlePackageType</key>
            <string>BNDL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
        </dict>
        </plist>
        EOF

        # 3. 暴力硬编！产物输出到刚刚创建的干净目录中！
        clang -O2 -bundle -undefined dynamic_lookup \
          -arch x86_64 -arch arm64 \
          -o FreshOutput/tolua.bundle/Contents/MacOS/tolua \
          -I/usr/local/include -I./macnojit/ \
          tolua.c int64.c uint64.c pb.c lpeg.c struct.c \
          cjson/strbuf.c cjson/lua_cjson.c cjson/fpconv.c \
          luasocket/auxiliar.c luasocket/buffer.c luasocket/except.c \
          luasocket/inet.c luasocket/io.c luasocket/luasocket.c \
          luasocket/mime.c luasocket/options.c luasocket/select.c \
          luasocket/tcp.c luasocket/timeout.c luasocket/udp.c luasocket/usocket.c \
          macnojit/lapi.c macnojit/lcode.c macnojit/lctype.c macnojit/ldebug.c \
          macnojit/ldo.c macnojit/ldump.c macnojit/lfunc.c macnojit/lgc.c \
          macnojit/llex.c macnojit/lmem.c macnojit/lobject.c macnojit/lopcodes.c \
          macnojit/lparser.c macnojit/lstate.c macnojit/lstring.c macnojit/ltable.c \
          macnojit/ltm.c macnojit/lundump.c macnojit/lvm.c macnojit/lzio.c \
          macnojit/lauxlib.c macnojit/lbaselib.c macnojit/lbitlib.c macnojit/lcorolib.c \
          macnojit/ldblib.c macnojit/liolib.c macnojit/lmathlib.c macnojit/loslib.c \
          macnojit/lstrlib.c macnojit/ltablib.c macnojit/loadlib.c macnojit/linit.c
          
        # 4. 【灵魂验证】强行打印出刚编出来的文件的架构信息，让你在网页日志里亲眼看到它是不是包含了 arm64！
        echo "=== 检查编译出来的二进制架构 ==="
        lipo -info FreshOutput/tolua.bundle/Contents/MacOS/tolua

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64_FRESH
        path: FreshOutput/tolua.bundle # 只上传这个干净目录里的东西！
