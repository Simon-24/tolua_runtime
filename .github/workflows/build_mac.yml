name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # 【关键修复】确保拉取所有子模块（如 macnojit）

    - name: Modify Xcode Project for ARM64
      run: |
        cd mac
        
        # 1. 强行把工程文件里的 i386 架构删掉，替换为 x86_64 和 arm64
        sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_64_BIT)";/ARCHS = "x86_64 arm64";/g' tolua.xcodeproj/project.pbxproj
        sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_BIT)";/ARCHS = "x86_64 arm64";/g' tolua.xcodeproj/project.pbxproj
        sed -i '' 's/VALID_ARCHS = "i386 x86_64";/VALID_ARCHS = "x86_64 arm64";/g' tolua.xcodeproj/project.pbxproj
        
        # 2. 把最低系统要求从 10.8 强行提高到 10.13，绕过废弃报错
        sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.8;/MACOSX_DEPLOYMENT_TARGET = 10.13;/g' tolua.xcodeproj/project.pbxproj
        
        # 3. 确保 build_osx.sh 里也加入了 arm64 参数
        sed -i '' 's/-arch x86_64/-arch x86_64 -arch arm64/g' build_osx.sh
        
    - name: Build tolua.bundle
      run: |
        cd mac
        chmod +x build_osx.sh
        # 执行原本的编译脚本
        ./build_osx.sh
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64
        path: mac/Plugins/tolua.bundle # 产物路径在 mac 目录里
