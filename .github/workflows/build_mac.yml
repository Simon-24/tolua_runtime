name: Build Mac ToLua Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # 拉取可能存在的源码子模块

    - name: Modify Xcode Project for ARM64
      run: |
        # 直接在根目录下操作！
        
        # 1. 强改工程文件：把 Xcode 默认的 i386 架构替换掉，换成最新的双架构
        sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_64_BIT)";/ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
        sed -i '' 's/ARCHS = "$(ARCHS_STANDARD_32_BIT)";/ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
        sed -i '' 's/VALID_ARCHS = "i386 x86_64";/VALID_ARCHS = "x86_64 arm64";/g' macnojit/tolua.xcodeproj/project.pbxproj
        
        # 2. 强改工程文件：把最低系统要求从 10.8 强行提高到 10.13
        sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.8;/MACOSX_DEPLOYMENT_TARGET = 10.13;/g' macnojit/tolua.xcodeproj/project.pbxproj
        
        # 3. 确保 build_osx.sh 里也加入了 arm64 参数
        sed -i '' 's/-arch x86_64/-arch x86_64 -arch arm64/g' build_osx.sh
        
    - name: Build tolua.bundle
      run: |
        # 赋予执行权限并在根目录执行编译
        chmod +x build_osx.sh
        ./build_osx.sh
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tolua_mac_bundle_arm64
        # 产物会被输出到根目录的 Plugins 文件夹中
        path: Plugins/tolua.bundle
