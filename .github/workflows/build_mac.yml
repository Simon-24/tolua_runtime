name: Build Mac ToLua Bundle

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: macos-latest # 使用最新的 macOS 节点
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # 【修复1】升级到 v4，解决弃用报错

    - name: Modify Build Script for ARM64
      run: |
        # 【修复2】去掉了 cd mac，因为脚本就在根目录
        sed -i '' 's/-arch x86_64/-arch x86_64 -arch arm64/g' build_osx.sh
        
    - name: Build tolua.bundle
      run: |
        # 直接在根目录执行编译
        chmod +x build_osx.sh
        ./build_osx.sh
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # 【修复1】升级到 v4，解决弃用报错
      with:
        name: tolua_mac_bundle_arm64
        path: Plugins/tolua.bundle # 【修复2】修改产物路径为根目录下的 Plugins
